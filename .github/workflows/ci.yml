name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('ci-main-{0}', github.run_id) || format('ci-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MJPS_LLM_MODE: mock
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  verification_scope:
    name: Classify verification inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      e2e: ${{ steps.scope.outputs.e2e }}
      governance: ${{ steps.scope.outputs.governance }}
      workflow_contract: ${{ steps.scope.outputs.workflow_contract }}
      package: ${{ steps.scope.outputs.package }}
      public_text: ${{ steps.scope.outputs.public_text }}
      classification_ok: ${{ steps.scope.outputs.classification_ok }}
      selected_checks: ${{ steps.scope.outputs.selected_checks }}
      changed_path_count: ${{ steps.scope.outputs.changed_path_count }}
      unknown_path_count: ${{ steps.scope.outputs.unknown_path_count }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Classify changed paths
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set +e
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            python scripts/classify_verification_inputs.py --base "${PR_BASE_SHA}" --head "${PR_HEAD_SHA}" --github-output "${GITHUB_OUTPUT}"
          elif [ "${GIT_REF}" = "refs/heads/main" ]; then
            python scripts/classify_verification_inputs.py --full --github-output "${GITHUB_OUTPUT}"
          else
            python scripts/classify_verification_inputs.py --base "${BEFORE_SHA}" --head "${PUSH_HEAD_SHA}" --github-output "${GITHUB_OUTPUT}"
          fi
          classifier_status=$?
          set -e
          echo "classifier_status=${classifier_status}" >> "${GITHUB_OUTPUT}"

      - name: Fail closed when classification is incomplete
        if: ${{ steps.scope.outputs.classification_ok != 'true' }}
        run: |
          echo "::error::Verification input classification failed closed; no selected gate may be treated as complete."
          exit 1

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verification_scope
    if: >-
      ${{
        needs.verification_scope.result == 'success' &&
        needs.verification_scope.outputs.classification_ok == 'true' &&
        needs.verification_scope.outputs.backend == 'true'
      }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint backend
        run: make lint

      - name: Typecheck backend
        run: make typecheck

      - name: Run backend tests
        run: make test

      - name: Compile backend
        run: make build

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verification_scope
    if: >-
      ${{
        needs.verification_scope.result == 'success' &&
        needs.verification_scope.outputs.classification_ok == 'true' &&
        needs.verification_scope.outputs.frontend == 'true'
      }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: make client-install

      - name: Lint client
        run: make client-lint

      - name: Typecheck client
        run: make client-typecheck

      - name: Test client
        run: make client-test

      - name: Build client
        run: make client-build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: verification_scope
    if: >-
      ${{
        needs.verification_scope.result == 'success' &&
        needs.verification_scope.outputs.classification_ok == 'true' &&
        needs.verification_scope.outputs.e2e == 'true'
      }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          make client-install

      - name: Install Playwright browser
        run: cd client && npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: make e2e

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verification_scope
    if: >-
      ${{
        needs.verification_scope.result == 'success' &&
        needs.verification_scope.outputs.classification_ok == 'true' &&
        needs.verification_scope.outputs.package == 'true'
      }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          make client-install

      - name: Generate OpenAPI
        run: make generate-openapi

      - name: Verify committed OpenAPI is current
        run: git diff --exit-code -- client/src/shared/types/openapi.json

      - name: Build package
        run: make package

  public_text:
    name: Public text policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verification_scope
    if: >-
      ${{
        needs.verification_scope.result == 'success' &&
        needs.verification_scope.outputs.classification_ok == 'true' &&
        needs.verification_scope.outputs.public_text == 'true'
      }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Verify public text policy
        run: python scripts/verify_ui_text.py

  governance:
    name: Governance validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verification_scope
    if: >-
      ${{
        needs.verification_scope.result == 'success' &&
        needs.verification_scope.outputs.classification_ok == 'true' &&
        needs.verification_scope.outputs.governance == 'true'
      }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install governance dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate governance
        run: python scripts/validate_governance.py

      - name: Run focused governance tests
        run: python -m pytest -q tests/test_validate_governance.py tests/test_governance_task_state.py tests/test_ci_workflow.py tests/test_verification_inputs.py

  workflow_contract:
    name: Workflow contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verification_scope
    if: >-
      ${{
        needs.verification_scope.result == 'success' &&
        needs.verification_scope.outputs.classification_ok == 'true' &&
        needs.verification_scope.outputs.workflow_contract == 'true'
      }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install workflow contract dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Parse workflow YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in sorted(Path(".github/workflows").glob("*.y*ml")):
              yaml.safe_load(path.read_text(encoding="utf-8"))
          PY

      - name: Run workflow and classifier contract tests
        run: python -m pytest -q tests/test_ci_workflow.py tests/test_verification_inputs.py

  platform_smoke:
    name: Platform smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    needs: verification_scope
    if: >-
      ${{
        needs.verification_scope.result == 'success' &&
        needs.verification_scope.outputs.classification_ok == 'true' &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main'
      }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Python smoke tests
        run: python -m pytest

      - name: Compile Python sources
        run: python -m compileall -q src

      - name: Build client
        run: |
          cd client
          npm ci
          npm run build

  quality_gate:
    name: Quality gate (selected checks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ always() }}
    needs:
      - verification_scope
      - backend
      - frontend
      - e2e
      - package
      - public_text
      - governance
      - workflow_contract
      - platform_smoke
    steps:
      - name: Validate selected job results
        env:
          CLASSIFIER_RESULT: ${{ needs.verification_scope.result }}
          CLASSIFICATION_OK: ${{ needs.verification_scope.outputs.classification_ok }}
          BACKEND_SELECTED: ${{ needs.verification_scope.outputs.backend == 'true' }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_SELECTED: ${{ needs.verification_scope.outputs.frontend == 'true' }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          E2E_SELECTED: ${{ needs.verification_scope.outputs.e2e == 'true' }}
          E2E_RESULT: ${{ needs.e2e.result }}
          PACKAGE_SELECTED: ${{ needs.verification_scope.outputs.package == 'true' }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          PUBLIC_TEXT_SELECTED: ${{ needs.verification_scope.outputs.public_text == 'true' }}
          PUBLIC_TEXT_RESULT: ${{ needs.public_text.result }}
          GOVERNANCE_SELECTED: ${{ needs.verification_scope.outputs.governance == 'true' }}
          GOVERNANCE_RESULT: ${{ needs.governance.result }}
          WORKFLOW_SELECTED: ${{ needs.verification_scope.outputs.workflow_contract == 'true' }}
          WORKFLOW_RESULT: ${{ needs.workflow_contract.result }}
          PLATFORM_REQUIRED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          PLATFORM_RESULT: ${{ needs.platform_smoke.result }}
        run: |
          set -euo pipefail
          test "${CLASSIFIER_RESULT}" = "success"
          test "${CLASSIFICATION_OK}" = "true"

          check_selected() {
            local selected="$1"
            local result="$2"
            local label="$3"
            if [ "${selected}" = "true" ]; then
              if [ "${result}" != "success" ]; then
                echo "${label} was selected but ended with ${result}" >&2
                return 1
              fi
            elif [ "${result}" != "skipped" ]; then
              echo "${label} was not selected but ended with ${result}" >&2
              return 1
            fi
          }

          check_selected "${BACKEND_SELECTED}" "${BACKEND_RESULT}" backend
          check_selected "${FRONTEND_SELECTED}" "${FRONTEND_RESULT}" frontend
          check_selected "${E2E_SELECTED}" "${E2E_RESULT}" e2e
          check_selected "${PACKAGE_SELECTED}" "${PACKAGE_RESULT}" package
          check_selected "${PUBLIC_TEXT_SELECTED}" "${PUBLIC_TEXT_RESULT}" public_text
          check_selected "${GOVERNANCE_SELECTED}" "${GOVERNANCE_RESULT}" governance
          check_selected "${WORKFLOW_SELECTED}" "${WORKFLOW_RESULT}" workflow_contract

          if [ "${PLATFORM_REQUIRED}" = "true" ]; then
            test "${PLATFORM_RESULT}" = "success"
          else
            test "${PLATFORM_RESULT}" = "skipped"
          fi
